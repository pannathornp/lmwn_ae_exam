version: 2

models:
  - name: report__delivery_zone_heatmap
    description: >
      Summary of delivery performance metrics by delivery zone.

    columns:
      - name: delivery_zone
        description: Geographic delivery area or zone.

      - name: total_order
        description: Total number of orders placed in the delivery zone.

      - name: total_driver
        description: Number of unique drivers who delivered in the delivery zone.

      - name: completed
        description: Number of successfully completed deliveries in the zone.

      - name: canceled
        description: Number of deliveries canceled by customer or system in the zone.

      - name: failed
        description: Number of deliveries marked as failed in the zone.

      - name: order_completion_rate_percent
        description: Percentage of orders completed out of total placed in the zone.

      - name: avg_delivery_time_minute
        description: Average time (in minutes) taken to complete a delivery in the zone.

  - name: report__driver_incentive_impact
    description: >
      Summary of the effectiveness of driver incentive programs.

    columns:
      - name: incentive_program
        description: Name of the incentive program offered to the driver.

      - name: driver_id
        description: Unique identifier of the driver participating in the incentive program.

      - name: bonus_amount
        description: Total bonus amount awarded to the driver.

      - name: avg_delivery_assigned
        description: Average number of deliveries assigned to the driver during the incentive period.

      - name: avg_delivery_completed
        description: Average number of deliveries successfully completed by the driver during the incentive period.

      - name: driver_rating
        description: Average customer rating of the driver.

      - name: total_revenue
        description: Total revenue generated by the driver while participating in the incentive program.

  - name: report__driver_performance
    description: >
      Summarize performance of drivers across different regions.

    columns:
      - name: driver_id
        description: Unique identifier for the driver.

      - name: region
        description: Geographic region where the driver primarily operates.

      - name: bonus_amount
        description: Total bonus amount earned by the driver.

      - name: delivery_assigned
        description: Average number of deliveries assigned to the driver.

      - name: delivery_completed
        description: Average number of deliveries completed by the driver.

      - name: late
        description: Number of late delivery complaints reported against the driver.

      - name: not_delivered
        description: Number of complaints about orders not being delivered.

      - name: avg_delivery_time_minute
        description: Average time (in minutes) taken by the driver to complete deliveries.

      - name: avg_delivery_distance_km
        description: Average delivery distance (in kilometers) for completed orders.

      - name: driver_rating
        description: Average rating given to the driver by customers.