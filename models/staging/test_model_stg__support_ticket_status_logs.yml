version: 2

models:
  - name: model_stg__support_ticket_status_logs
    description: "Tracks the status changes of each support ticket over time."
    columns:
      - name: log_id
        description: "Unique identifier for each log entry."
        tests:
          - not_null
          - unique

      - name: ticket_id
        description: "Unique identifier for each support ticket."
        tests:
          - not_null

      - name: status
        description: "Current status of the support ticket (opened, resolved)."
        tests:
          - not_null
          - accepted_values:
              values:
                - opened
                - resolved

      - name: status_datetime
        description: "Timestamp when the status was recorded."
        tests:
          - not_null

      - name: agent_id
        description: "Unique identifier for the support agent that respond the ticket."
        tests:
          - not_null
