version: 2

models:
  - name: model_stg__order_log_incentive_sessions_order_status_logs
    description: "Logs the step-by-step status updates for each order from creation to delivery or cancellation."
    columns:
      - name: log_id
        description: "Unique identifier for each order status log entry."
        tests:
          - not_null
          - unique

      - name: order_id
        description: "Unique identifier for each order."
        tests:
          - not_null

      - name: status
        description: "Current status of the order (created, in_progress, delivered, cancelled)."
        tests:
          - not_null
          - accepted_values:
              values:
                - created
                - accepted
                - picked_up
                - completed
                - canceled
                - failed

      - name: status_datetime
        description: "Datetime when the status was updated."
        tests:
          - not_null

      - name: updated_by
        description: "Identifier of the entity that updated the status (driver, system, customer)."

  

